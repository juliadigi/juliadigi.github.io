<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitekniikat - Sää Helsingissä</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            color: #333;
            font-family: Arial, sans-serif;
        }
        .navbar-custom {
            background-color: #0d6efd;
        }
        .main-container {
            background: #ffffff;
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /*  sääkortti */
        .weather-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #bbdefb;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
            max-width: 400px;
        }
        /* Ikonin muotoilu ja varjostus */
        .weather-icon-wrapper {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }
        .weather-icon-wrapper img {
            width: 100px;
            height: 100px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }
        .temp-text {
            font-size: 2rem;
            font-weight: bold;
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <!-- Navigaatiopalkki -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Digitekniikat</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA 1)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA 2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pokemon.html">Poke haku</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="saa.html">Tehtävä 3</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sisältöalue -->
    <div class="container">
        <div class="main-container">
            <h1>Sää Helsingissä</h1>
            <p id="kellonaika" class="text-muted fw-bold"></p>

            <div id="vastaus">
                <p>Ladataan säätietoja...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Haetaan nykyinen kellonaika ladattaessa
        const nyt = new Date();
        const tunnit = String(nyt.getHours()).padStart(2, '0');
        const minutit = String(nyt.getMinutes()).padStart(2, '0');
        document.getElementById("kellonaika").innerText = "Sää kello " + tunnit + ":" + minutit;

        // OpenWeather API haetaan sieltä Helsingin sää
        const url = "https://api.openweathermap.org/data/2.5/weather?id=658225&appid=665ecd56dfc08dbb50feb8b8f5034e28&lang=fi&units=metric";

        fetch(url)
          .then(function (response) {
            if (!response.ok) {
                throw new Error("Säätietojen haku epäonnistui");
            }
            return response.json();
          })
          .then(function (data) {
            naytaSaa(data);
          })
          .catch(function (error) {
            document.getElementById("vastaus").innerHTML = "<p class='text-danger'>Tietoa ei pystytä hakemaan</p>";
          });
        // tulosta säätiedot korttiin
        function naytaSaa(data) {
          let kuvaus = data.weather[0].description;
          let lampotila = data.main.temp;
          let tuuli = data.wind.speed;
          let iconKoodi = data.weather[0].icon;

          // sääikoni openweather
          let kuvaUrl = "https://openweathermap.org/img/wn/" + iconKoodi + "@4x.png";

          // tehdään kortin html
          let html = "<div class='weather-card'>";
          html += "<div class='d-flex align-items-center mb-3'>";
          html += "  <div class='weather-icon-wrapper me-3'><img src='" + kuvaUrl + "' alt='" + kuvaus + "'></div>";
          html += "  <div>";
          html += "    <div class='temp-text'>" + lampotila + " °C</div>";
          html += "    <div class='text-capitalize text-secondary fw-semibold'>" + kuvaus + "</div>";
          html += "  </div>";
          html += "</div>";
          html += "<hr>";
          html += "<p class='mb-0'><b>Tuulen nopeus:</b> " + tuuli + " m/s</p>";
          html += "</div>";

          document.getElementById("vastaus").innerHTML = html;
        }
    </script>
</body>
</html>
