<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitekniikat - Pokemon haku</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            color: #333;
            font-family: Arial, sans-serif;
        }
        .navbar-custom {
            background-color: #0d6efd;
        }
        .main-container {
            background: #ffffff;
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* Hakukentän ja kortin muotoilu */
        .poke-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #eef5ff;
            border-left: 4px solid #0d6efd;
        }
        #kuva2 img {
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>

    <!-- Navigaatio (Korjatuilla linkeillä ja li-tägeillä) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Digitekniikat</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Etusivu (Tehtävä 1 OSA 1)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA 2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="pokemon.html">Poke haku (Tehtävä 2 OSA 1)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pokemon.html?autokaannos=true">Tehtävä 2 OSA 2</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="saa.html">Tehtävä 3</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Sisältöalue -->
    <div class="container">
        <div class="main-container">
            <h1>Pokemon haku</h1>
            <p>Kirjoita hakukenttään Pokemonin nimi (esim. <i>eevee</i>, <i>pikachu</i>, <i>ditto</i>):</p>
            
            <!-- Hakukenttä ja Hae-painike -->
            <div class="row g-2 col-md-6 mb-3">
                <div class="col-8">
                    <input type="text" id="pokemonName" class="form-control" placeholder="Enter Pokemon name">
                </div>
                <div class="col-4">
                    <button onclick="poke()" class="btn btn-primary w-100">Hae</button>
                </div>
            </div>

            <!-- Paikka haetuille tiedoille -->
            <div id="vastaus">
                <div id="nimi" class="fw-bold fs-4 text-primary">Kirjoita laatikkoon Pokemonin nimi</div>
                <p id="kuva2"></p>
                <!-- Paikka Käännä-painikkeelle -->
                <div id="kaannaNappi"></div>
                <!-- Paikka 3 lisäominaisuudelle -->
                <div id="ominaisuudet" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript-koodi -->
    <script>
        let nykyinenObj = null;
        let pokenNimi = "";

        // Tarkistetaan sivun latautuessa, ollaanko tultu "Tehtävä 2 OSA 2" -linkistä
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('autokaannos') === 'true') {
                document.getElementById("pokemonName").value = "eevee";
                poke(true); // Suoritetaan haku ja käännös automaattisesti
            }
        };

        function poke(autokaannos = false) {
            const pokeName = document.getElementById("pokemonName").value.toLowerCase().trim();
            pokenNimi = document.getElementById("pokemonName").value;

            if (!pokeName) {
                document.getElementById("nimi").innerHTML = "Kirjoita Pokemonin nimi!";
                return;
            }

            document.getElementById("kaannaNappi").innerHTML = "";
            document.getElementById("ominaisuudet").innerHTML = "";
            document.getElementById("nimi").innerHTML = "Haetaan tietoja...";

            fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)
              .then(function (response) {
                if (!response.ok) {
                    throw new Error("Pokemonia ei löytynyt");
                }
                return response.json();
              })
              .then(function (responseJson) {
                pokekuva(responseJson);
                // Jos tultiin OSA 2 -linkistä, suoritetaan kääntäminen automaattisesti
                if (autokaannos) {
                    kaanna();
                }
              })
              .catch(function (error) {
                document.getElementById("nimi").innerHTML = "<b class='text-danger'>Tietoa ei pystytä hakemaan</b>";
                document.getElementById("kuva2").innerHTML = "";
              });
        }

        function pokekuva(obj) {
            nykyinenObj = obj;

            let pokeurl = obj.sprites.front_default;

            document.getElementById("kuva2").innerHTML = "<img src='" + pokeurl + "' alt='Pokemon kuva'>";
            document.getElementById("nimi").innerHTML = "<b>" + pokenNimi.toUpperCase() + "</b>";
            document.getElementById("pokemonName").value = "";

            document.getElementById("kaannaNappi").innerHTML = 
                "<button onclick='kaanna()' class='btn btn-outline-primary mt-2'>Käännä</button>";
        }

        function kaanna() {
            if (!nykyinenObj) return;

            let backUrl = nykyinenObj.sprites.back_default || nykyinenObj.sprites.front_default;
            document.getElementById("kuva2").innerHTML = "<img src='" + backUrl + "' alt='Pokemon selin'>";

            let height = nykyinenObj.height;
            let weight = nykyinenObj.weight;
            let baseExp = nykyinenObj.base_experience;

            let omHTML = "<div class='poke-card'>";
            omHTML += "<h5>Pokemonin ominaisuudet:</h5>";
            omHTML += "<ul>";
            omHTML += "<li><b>Pituus:</b> " + height + " dm</li>";
            omHTML += "<li><b>Paino:</b> " + weight + " hg</li>";
            omHTML += "<li><b>Peruskokemus (Base EXP):</b> " + baseExp + "</li>";
            omHTML += "</ul></div>";

            document.getElementById("ominaisuudet").innerHTML = omHTML;
        }
    </script>
</body>
</html>
