<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitekniikat - Pokemon haku</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            color: #333;
            font-family: Arial, sans-serif;
        }
        .navbar-custom {
            background-color: #0d6efd;
        }
        .main-container {
            background: #ffffff;
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        /* Hakukentän ja kortin muotoilu */
        .poke-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background-color: #eef5ff;
            border-left: 4px solid #0d6efd;
        }
        #kuva2 img {
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>

    <!-- Navigaatio (Tehtävä 2 OSA 1 & 2 aktiivisena) -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Digitekniikat</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Tehtävä 1 OSA 1</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="toteutus.html">Tehtävä 1 OSA 2</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="pokemon.html">Tehtävä 2 (Poke Haku)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="saa.html">Tehtävä 3 (Sää)</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <!-- Sisältöalue -->
    <div class="container">
        <div class="main-container">
            <h1>Pokemon haku</h1>
            <p>Kirjoita hakukenttään Pokemonin nimi (esim. <i>eevee</i>, <i>pikachu</i>, <i>ditto</i>):</p>
            
            <!-- Hakukenttä ja Hae-painike (Dia 1) -->
            <div class="row g-2 col-md-6 mb-3">
                <div class="col-8">
                    <input type="text" id="pokemonName" class="form-control" placeholder="Enter Pokemon name">
                </div>
                <div class="col-4">
                    <button onclick="poke()" class="btn btn-primary w-100">Hae</button>
                </div>
            </div>

            <!-- Paikka haetuille tiedoille (Dia 1 & 6) -->
            <div id="vastaus">
                <div id="nimi" class="fw-bold fs-4 text-primary">Kirjoita laatikkoon Pokemonin nimi</div>
                <p id="kuva2"></p>
                <!-- Paikka Käännä-painikkeelle (OSA II) -->
                <div id="kaannaNappi"></div>
                <!-- Paikka 3 lisäominaisuudelle (OSA II) -->
                <div id="ominaisuudet" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript-koodi (Diat 2-6) -->
    <script>
        // Globaalit muuttujat Käännä-toimintoa varten
        let nykyinenObj = null;
        let pokenNimi = "";

        // Funktio poke() - Kutsutaan kun Hae-painiketta painetaan (Dia 2)
        function poke() {
            // Luetaan nimi ja muunnetaan pieniksi kirjaimiksi (Dia 2)
            const pokeName = document.getElementById("pokemonName").value.toLowerCase().trim();
            pokenNimi = document.getElementById("pokemonName").value;

            if (!pokeName) {
                document.getElementById("nimi").innerHTML = "Kirjoita Pokemonin nimi!";
                return;
            }

            // Tyhjennetään edellisen haun kääntönappi ja ominaisuudet
            document.getElementById("kaannaNappi").innerHTML = "";
            document.getElementById("ominaisuudet").innerHTML = "";
            document.getElementById("nimi").innerHTML = "Haetaan tietoja...";

            // Haetaan JSON-tieto PokeAPI:sta (Dia 4)
            fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)
              .then(function (response) {
                if (!response.ok) {
                    throw new Error("Pokemonia ei löytynyt");
                }
                return response.json();
              })
              .then(function (responseJson) {
                pokekuva(responseJson);
              })
              .catch(function (error) {
                document.getElementById("nimi").innerHTML = "<b class='text-danger'>Tietoa ei pystytä hakemaan</b>";
                document.getElementById("kuva2").innerHTML = "";
              });
        }

        // Funktio pokekuva(obj) - Näytetään kuva edestä (Dia 5 & 6)
        function pokekuva(obj) {
            nykyinenObj = obj; // Tallennetaan muistiin kääntämistä varten

            // Kuvan osoite front_default (Dia 3 & 5)
            let pokeurl = obj.sprites.front_default;

            document.getElementById("kuva2").innerHTML = "<img src='" + pokeurl + "' alt='Pokemon kuva'>";
            document.getElementById("nimi").innerHTML = "<b>" + pokenNimi.toUpperCase() + "</b>";
            document.getElementById("pokemonName").value = ""; // Tyhjennetään hakukenttä (Dia 5)

            // Lisätään "Käännä"-painike vasta haun jälkeen (OSA II / Dia 6)
            document.getElementById("kaannaNappi").innerHTML = 
                "<button onclick='kaanna()' class='btn btn-outline-primary mt-2'>Käännä</button>";
        }

        // Funktio kaanna() - Käännetään Pokemon ja näytetään 3 ominaisuutta (OSA II / Dia 6)
        function kaanna() {
            if (!nykyinenObj) return;

            // Käännetään kuva (back_default) (Dia 3 & 6)
            let backUrl = nykyinenObj.sprites.back_default || nykyinenObj.sprites.front_default;
            document.getElementById("kuva2").innerHTML = "<img src='" + backUrl + "' alt='Pokemon selin'>";

            // 3 Ominaisuutta näkyville (Pituus, Paino ja Kokemuspisteet) (Dia 6)
            let height = nykyinenObj.height;
            let weight = nykyinenObj.weight;
            let baseExp = nykyinenObj.base_experience;

            let omHTML = "<div class='poke-card'>";
            omHTML += "<h5>Pokemonin ominaisuudet:</h5>";
            omHTML += "<ul>";
            omHTML += "<li><b>Pituus:</b> " + height + " dm</li>";
            omHTML += "<li><b>Paino:</b> " + weight + " hg</li>";
            omHTML += "<li><b>Peruskokemus (Base EXP):</b> " + baseExp + "</li>";
            omHTML += "</ul></div>";

            document.getElementById("ominaisuudet").innerHTML = omHTML;
        }
    </script>
</body>
</html>
