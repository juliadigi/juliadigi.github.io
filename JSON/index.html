<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>JSON-tehtävä</title>
</head>
<body>

    <!-- HTML-elementit, joihin data sijoitetaan -->
    <h1 id="otsikko"></h1>
    <p id="kuvaus"></p>
    <img id="kuva" src="" alt="Digi kuva">

    <!-- JavaScript-koodi lisätään tänne ennen body-tägin sulkeutumista -->
    <script>
        fetch('tietue.json')
          .then(response => response.json())
          .then(data => {
            // Asetetaan haettu data HTML-elementteihin
            document.getElementById("otsikko").innerText = data.otsikko;
            document.getElementById("kuvaus").innerText = data.kuvaus;
            document.getElementById("kuva").src = data.kuva;
          })
          .catch(error => console.error('Virhe:', error));
    </script>
</body>
</html>
