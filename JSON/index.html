<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>JSON Testi</title>
</head>
<body>
  <h1>JSON Testi</h1>
  <div id="tulos">Ladataan JSON-dataa...</div>

  <script>
    console.log("Skripti käynnistyi");

    fetch("tietue.json")
      .then(response => {
        console.log("Fetch status:", response.status);
        if (!response.ok) {
          throw new Error("JSON-tiedostoa ei löytynyt");
        }
        return response.json();
      })
      .then(data => {
        console.log("Data ladattu:", data);
        document.getElementById("tulos").innerHTML = `
          <h2>${data.otsikko}</h2>
          <p>${data.kuvaus}</p>
          <img src="${data.kuva}" width="300">
        `;
      })
      .catch(error => {
        document.getElementById("tulos").innerHTML =
          "<p style='color:red;'>Virhe: " + error.message + "</p>";
        console.error(error);
      });
  </script>
</body>
</html>
